
services:
  api:
    build: .
    container_name: samvidhansathi-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5

  ui:
    build: .
    container_name: samvidhansathi-ui
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./ui/feedback.csv:/app/ui/feedback.csv
    depends_on:
      api:
        condition: service_healthy

volumes:
  chroma_data:
